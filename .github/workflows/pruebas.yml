
name: pruebas

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas Hito 2
        working-directory: ./Hito 2
        run: python -m pytest

      - name: Ejecutar benchmark de colas
        working-directory: ./Hito 2
        run: python benchmarks/bench_colas.py

      - name: Ejecutar benchmark de listas
        working-directory: ./Hito 2
        run: python benchmarks/bench_listas.py

      - name: Ejecutar pruebas Hito 3
        working-directory: ./Hito 3
        run: python -m pytest

      - name: Ejecutar benchmark de grafos
        working-directory: ./Hito 3
        run: python benchmarks/bench_grafo.py

      - name: Ejecutar demo del criterio de éxito
        working-directory: ./Hito 3
        run: python benchmarks/demo_criterio.py


      - name: Subir gráficos de benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graficos-benchmarks
          path: |
            Hito 2/benchmarks/*.png
            Hito 2/resultados_bench_*.png
            Hito 3/Benchmark/*.png
